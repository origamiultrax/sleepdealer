<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Dealer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-shell home-shell">
    <aside class="sidebar">
      <div class="logo-wrap">
        <img src="logo.png" alt="Sleep Dealer Logo" class="logo" />
      </div>
    </aside>

    <main class="main-content home-main">
      <section class="moon-stage">
        <div class="moon-system">
          <div class="moon-core">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/b/b8/Moon_rotating_full_160px.gif"
              alt="Rotating moon"
              class="moon-gif"
            />
            <span class="moon-noise"></span>
          </div>

          <a href="shop.html" class="orbit-item orbit-shop">
            <span class="star-icon-wrap">
              <img
                src="https://media0.giphy.com/media/v1.Y2lkPTZjMDliOTUycmt2cXYwdTRldGdlb3p1dXR2dnJyNG12dXlveG5uOTJlbWNqMnZjZCZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/C4b6GwFKbYxK8/200w.gif"
                alt=""
                class="star-gif"
              />
            </span>
            <span class="orbit-label">Shop</span>
          </a>

          <a href="order-services.html" class="orbit-item orbit-services">
            <span class="star-icon-wrap">
              <img
                src="https://media0.giphy.com/media/v1.Y2lkPTZjMDliOTUycmt2cXYwdTRldGdlb3p1dXR2dnJyNG12dXlveG5uOTJlbWNqMnZjZCZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/C4b6GwFKbYxK8/200w.gif"
                alt=""
                class="star-gif"
              />
            </span>
            <span class="orbit-label">Order Services</span>
          </a>

          <a
            href="https://www.origamiultra.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="orbit-item orbit-origami"
          >
            <span class="star-icon-wrap">
              <img
                src="https://media0.giphy.com/media/v1.Y2lkPTZjMDliOTUycmt2cXYwdTRldGdlb3p1dXR2dnJyNG12dXlveG5uOTJlbWNqMnZjZCZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/C4b6GwFKbYxK8/200w.gif"
                alt=""
                class="star-gif"
              />
            </span>
            <span class="orbit-label">Origami Ultra</span>
          </a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
